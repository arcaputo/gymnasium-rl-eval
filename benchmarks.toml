# What the RL eval scores. Edit this file (and upload the eval again) to change the benchmarks;
# the metric schema in eval.toml stays the same whatever is listed here.

[agent]
# The subject's training function, as "module:function". The module is looked for in each subject
# (subjects/<name>/ and subjects/<name>/src/). See EVAL.md for the function's contract.
entry = "rl_agent:train"
# Install the subject's dependencies (its requirements.txt, else its pyproject.toml / setup.py)
# before running. Turn off if the eval's requirements.txt already has everything.
install = true

[run]
seeds = 4            # independent training runs per benchmark
eval_episodes = 10   # evaluation episodes per trained policy (seeded, deterministic actions)
workers = 0          # training runs in parallel; 0 = one per CPU
run_timeout_s = 0    # per training run; 0 = no limit (the job's timeout_s still applies)

# One table per benchmark. `env` is any registered Gymnasium id; `timesteps` is the training budget
# in environment steps. Optional: `target` (the return that counts as solved and as a normalized
# score of 1; defaults to the env's reward_threshold, required when it has none), `kwargs` (passed
# to gymnasium.make), `seeds`, `eval_episodes`.

[[benchmark]]
env = "InvertedPendulum-v5"   # MuJoCo cart-pole; target defaults to its reward_threshold (950), max return 1000
timesteps = 200_000
